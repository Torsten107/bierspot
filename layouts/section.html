{{ define "main" }}
<header class="seitenkopf">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}<div class="einleitung">{{ . }}</div>{{ end }}
</header>
{{- $pager := .Paginate .Pages }}
<ul class="beitragsliste">
  {{- range $pager.Pages }}
  <li>
    <a href="{{ .RelPermalink }}"><h2>{{ .Title }}</h2></a>
    {{- with .Summary }}<p>{{ . | plainify | truncate 180 }}</p>{{ end }}
  </li>
  {{- end }}
</ul>
{{ partial "pager.html" $pager }}
{{ end }}
